services:
  db:
    image: pgvector/pgvector:pg16
    container_name: incident_copilot_db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-incident_copilot_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-incident_copilot_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  graph:
    image: neo4j:5-community
    container_name: incident_copilot_graph
    restart: unless-stopped
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password12345}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password12345} "RETURN 1"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
